# M3ED: Prophesee EVK4 1280x720, OVC global-shutter RGB warped into the event
# frame. Train-only, so val stays pure DSEC and val_loss remains comparable
# across runs.
root_dir: ${data_root}/m3ed
output_dir: ${data_root}/m3ed/features
teacher_dir: ${data_root}/m3ed/megaloc
pair_stride: 1

train_seq_list: null        # null -> every sequence in pairs.txt
val_seq_list: []            # [] -> this corpus sits the split out

night_sequences:
  - car_urban_night_penno_big_loop
  - car_urban_night_penno_small_loop
  - car_urban_night_penno_small_loop_darker
  - car_urban_night_rittenhouse
  - car_urban_night_ucity_small_loop
