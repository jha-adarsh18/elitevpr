defaults:
  # The reported recipe: three corpora, MegaLoc teacher, relational KL.
  # Drop a corpus with `~corpora.vivid`, add one with `+datasets@corpora.<name>=<name>`.
  - datasets@corpora.dsec: dsec
  - datasets@corpora.m3ed: m3ed
  - datasets@corpora.vivid: vivid
  - model: student
  - training: phase1
  - loss: structural_kl
  - logging: wandb
  - _self_

seed: 42
num_workers: 2
allow_cpu: false
resume: true
early_stopping: 0           # 0 = run every epoch; validation is a weak criterion

# Corpus paths are derived from this; override a corpus's keys directly if its
# layout differs.
data_root: ???
teacher_file: megaloc.npy   # <teacher_dir>/<seq>/<this>, one row per frame

checkpoint_dir: ???
output_dir: ${checkpoint_dir}/hydra

hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}
