[project]
name = "elitevpr"
version = "0.1.0"
description = "Event-native VPR student distilled from a frozen RGB teacher"
requires-python = ">=3.12"
# Pinned to the stack that produced the reported numbers: timm owns the
# backbone implementation and its pretrained weights, so it is the dependency
# that can move a result. torch is pinned per environment in pixi.toml, because
# its CUDA build has to match the host driver.
dependencies = [
    "hydra-core==1.3.3",
    "numpy==2.4.6",
    "timm==1.0.27",
    "torch>=2.10,<2.13",
    "tqdm==4.68.3",
    "wandb==0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elitevpr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
