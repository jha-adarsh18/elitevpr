[workspace]
name = "elitevpr"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pytest = ">=9.2.0,<10"

[pypi-dependencies]
elitevpr = { path = ".", editable = true }

# torch's CUDA build must match the host driver, so it is pinned per
# environment rather than in pyproject.toml:
#   default  torch 2.12.1+cu130  -- the stack the reported numbers came from,
#                                   needs driver >= 580
#   cu128    torch 2.10.0+cu128  -- for hosts on driver 570 / CUDA 12.8
# Use ONE environment for all arms of a comparison.
[feature.cu130.pypi-dependencies]
torch = "==2.12.1"

[feature.cu128.pypi-dependencies]
torch = { version = "==2.10.0", index = "https://download.pytorch.org/whl/cu128" }

# The evaluation layer imports the official benchmark, which pulls in a few
# libraries the training package does not need. They live in their own feature
# so `default` stays exactly the stack the reported numbers came from.
[feature.eval.dependencies]
# pinned to pyproject's numpy, or the conda solve pulls a newer one and the
# pypi pin becomes unsatisfiable
numpy = "==2.4.6"
pandas = "*"
scikit-learn = "*"
scipy = "*"
pillow = "*"

[feature.eval.pypi-dependencies]
torchvision = "*"

[environments]
default = ["cu130"]
cu128 = ["cu128"]
eval = ["cu130", "eval"]

[tasks]
train = "python -m elitevpr.train"
test = "pytest -q"

[feature.eval.tasks]
# ELITEVPR_BENCH must point at a checkout of
# github.com/theresejoseph/ensemble_event_vpr_bench
acceptance = "python -m elitevpr.eval.acceptance"
eval-test = "pytest -q tests/test_eval.py"
